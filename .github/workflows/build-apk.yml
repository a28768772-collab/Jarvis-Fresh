name: Build Jarvis Fresh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          echo "Checking Jarvis project"
          ls -la
          find app -type f

      - name: Prepare Offline Voice Model Directory
        run: |
          mkdir -p app/src/main/assets
          echo "Voice model directory ready"
          ls -lah app/src/main/assets

          python3 - <<'PY'
          import urllib.request

          url = "https://ml-models-bucket.gauthamvijay.com/ecapa-body-192.tflite"

          try:
              request = urllib.request.Request(
                  url,
                  method="HEAD"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  print("HTTP Status:", response.status)
                  print("Model Size:", response.headers.get("Content-Length", "Unknown"))
                  print("Content Type:", response.headers.get("Content-Type", "Unknown"))

          except Exception as error:
              print("Model link verification failed:", error)
              raise SystemExit(1)
          PY

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build Jarvis APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Fresh-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
