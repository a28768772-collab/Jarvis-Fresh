name: Build Jarvis Fresh APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Files
        run: |
          echo "Checking Jarvis project"
          ls -la
          find app -type f

      # NEW: Prepare Offline Voice Model Folder
      - name: Prepare Offline Voice Model Directory
        run: |
          mkdir -p app/src/main/assets
          echo "Voice model directory ready"
          ls -lah app/src/main/assets

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build Jarvis APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload Jarvis APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Fresh-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
